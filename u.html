    /* 🎛️ CSS ΓΙΑ ΤΗΝ ΟΡΘΙΑ ΜΠΑΡΑ ΕΝΤΑΣΗΣ ΤΟΥ ΒΙΝΤΕΟ (HOVER EFFECT) */
    .video-volume-wrapper {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 100;
    }
    
    .video-volume-slider-container {
        display: none;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #00ffcc;
        border-radius: 6px;
        padding: 10px 5px;
        margin-top: 5px;
        height: 80px;
        box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }
    
    /* Όταν πηγαίνουμε το ποντίκι στο Wrapper, εμφανίζεται η όρθια μπάρα! */
    .video-volume-wrapper:hover .video-volume-slider-container {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .video-volume-slider {
        writing-mode: vertical-lr; /* 🔥 Στρέφει τη μπάρα σε ΟΡΘΙΑ διάταξη! */
        direction: rtl;
        width: 15px;
        height: 70px;
        accent-color: #00ffcc;
        cursor: pointer;
        margin: 0;
    }
                    /* 📸 CSS ΓΙΑ ΤΟ ADVANCED DYNAMIC ANIMATION SLIDE SHOW */
    .slideshow-display-area {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: none; z-index: 2;
      border-radius: 10px; overflow: hidden;
    }

    .slideshow-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
    }

        /* 🟢 ΣΥΝΔΕΣΗ ΟΛΩΝ ΤΩΝ ΕΦΕ ΜΕ ΤΑ ANIMATIONS (ΜΑΖΙ ΜΕ ΤΑ ΝΕΑ ADVANCED ΕΦΕ) */
    .slideshow-img.active.effect-fade    { animation: animFade 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-zoomIn  { animation: animZoomIn 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-zoomOut { animation: animZoomOut 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-left    { animation: animLeft 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-right   { animation: animRight 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-top     { animation: animTop 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-bottom  { animation: animBottom 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-flash   { animation: animFlash 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-swirl   { animation: animSwirl 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-burn    { animation: animBurn 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-wipeDissolve { animation: animWipeDissolve 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-spinZoom     { animation: animSpinZoom 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    
    /* 🔥 ΤΑ ΝΕΑ ΕΠΙΚΑ ΕΦΕ WONDERSHARE */
    .slideshow-img.active.effect-rollRightTop { animation: animRollRightTop 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-origin: right top; }
    .slideshow-img.active.effect-roundZoomIn  { animation: animRoundZoomIn 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-roundZoomOut { animation: animRoundZoomOut 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-moveRect1    { animation: animMoveRect1 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-moveRect2    { animation: animMoveRect2 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-depositUp    { animation: animDepositUp 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .slideshow-img.active.effect-diamontZoom  { animation: animDiamontZoom 2.5s ease-in-out forwards; }
     .slideshow-img.active.effect-heart   { animation: animHeart 2.5s ease-in-out forwards; }
    .slideshow-img.active.effect-star    { animation: animStar 2.5s ease-in-out forwards; }
  

    /* 🔒 Η ΠΑΛΙΑ ΕΙΚΟΝΑ ΠΟΥ ΣΒΗΝΕΙ */
    .slideshow-img.exit { animation: animExit 2.5s ease-in-out forwards; transform-origin: center; }

    /* 🎬 ΟΙ ΜΑΓΙΚΕΣ ΚΙΝΗΣΕΙΣ (KEYFRAMES) */
    @keyframes animFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes animZoomIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes animZoomOut { from { opacity: 0; transform: scale(1.4); } to { opacity: 1; transform: scale(1); } }
    @keyframes animLeft { from { opacity: 0; transform: translateX(-100%); } to { opacity: 1; transform: translateX(0); } }
    @keyframes animRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    @keyframes animTop { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: translateY(0); } }
    @keyframes animBottom { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
    @keyframes animFlash { 0% { opacity: 0; filter: brightness(3); } 40% { opacity: 0.5; filter: brightness(2); } 100% { opacity: 1; filter: brightness(1); } }
    @keyframes animSwirl { from { opacity: 0; transform: scale(0) rotate(-180deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }
    @keyframes animBurn { 0% { opacity: 0; filter: contrast(3) saturate(3) brightness(2); transform: scale(1.1); } 100% { opacity: 1; filter: contrast(1) saturate(1) brightness(1); transform: scale(1); } }
    @keyframes animWipeDissolve { 0% { opacity: 0; clip-path: inset(0 100% 0 0); filter: blur(5px); } 100% { opacity: 1; clip-path: inset(0 0 0 0); filter: blur(0px); } }
    @keyframes animSpinZoom { 0% { opacity: 0; transform: scale(0.2) rotate(-360deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
    @keyframes animExit { from { opacity: 1; } to { opacity: 0; } }

    /* 📜 WONDERSHARE: ROLL_RIGHT_TOP (Ξετυλίγεται σαν ΠΑΠΥΡΟΣ από πάνω δεξιά) */
    @keyframes animRollRightTop {
      0% { opacity: 0; transform: translate(50%, -50%) rotate3d(1, -1, 0, 90deg) skewX(20deg) scale(0.6); }
      50% { opacity: 0.6; transform: translate(20%, -20%) rotate3d(1, -1, 0, 45deg) skewX(10deg) scale(0.8); }
      100% { opacity: 1; transform: translate(0, 0) rotate3d(0, 0, 0, 0deg) skewX(0deg) scale(1); }
    }

    /* 🔴 WONDERSHARE: ROUND_ZOOM_IN (Κύκλος Ζουμ Μέσα) */
    @keyframes animRoundZoomIn {
      0% { opacity: 0; clip-path: circle(0% at 50% 50%); transform: scale(0.8); }
      100% { opacity: 1; clip-path: circle(100% at 50% 50%); transform: scale(1); }
    }

    /* ⭕ WONDERSHARE: ROUND_ZOOM_OUT (Κύκλος Ζουμ Έξω - Αντίστροφο άνοιγμα) */
    @keyframes animRoundZoomOut {
      0% { opacity: 0; clip-path: circle(0% at 50% 50%); transform: scale(1.4); }
      100% { opacity: 1; clip-path: circle(100% at 50% 50%); transform: scale(1); }
    }

    /* ⏹️ WONDERSHARE: MOVERECT_1 (Ορθογώνιο κουτί που ανοίγει από το κέντρο) */
    @keyframes animMoveRect1 {
      0% { opacity: 0; clip-path: inset(45% 45% 45% 45%); }
      100% { opacity: 1; clip-path: inset(0% 0% 0% 0%); }
    }

    /* 🔲 WONDERSHARE: MOVERECT_2 (Ορθογώνιο κουτί που ανοίγει οριζόντια σαν κουρτίνα) */
    @keyframes animMoveRect2 {
      0% { opacity: 0; clip-path: inset(0% 45% 0% 45%); }
      100% { opacity: 1; clip-path: inset(0% 0% 0% 0%); }
    }

    /* 🪂 WONDERSHARE: DEPOSIT_UP (Κατάθεση από ψηλά με τρισδιάστατη προοπτική) */
    @keyframes animDepositUp {
      0% { opacity: 0; transform: translateY(-60px) rotateX(15deg) scale(1.05); filter: brightness(1.5); }
      100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); filter: brightness(1); }
    }

    /* 💎 WONDERSHARE: DIAMONT_ZOOM (Ρόμβος/Διαμάντι που ανοίγει από το κέντρο) */
    @keyframes animDiamontZoom {
      0% { opacity: 0; clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%); transform: scale(0.9); }
      100% { opacity: 1; clip-path: polygon(50% -20%, 120% 50%, 50% 120%, -20% 50%); transform: scale(1); }
    }
    /* 💖 WONDERSHARE: HEART_ZOOM (Μια πανέμορφη καρδιά που ανοίγει από το κέντρο) */
    @keyframes animHeart {
      0% { opacity: 0; transform: scale(0.8); clip-path: polygon(50% 40%, 50% 40%, 50% 40%, 50% 40%, 50% 40%, 50% 40%, 50% 40%); }
      100% { opacity: 1; transform: scale(1); clip-path: polygon(50% 15%, 65% 0%, 85% 0%, 100% 20%, 100% 45%, 50% 95%, 0% 45%, 0% 20%, 15% 0%, 35% 0%); }
    }

    /* ⭐ WONDERSHARE: STAR_ZOOM (Ένα λαμπερό αστέρι 5 ακτίνων που ξεδιπλώνει τη φωτό) */
    @keyframes animStar {
      0% { opacity: 0; transform: scale(0.8); clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%); }
      100% { opacity: 1; transform: scale(1); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
    }


  </style>

      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      document.getElementById('clock-time').innerText = `${hours}:${minutes}:${seconds}`;
      document.getElementById('clock-date').innerText = `${day}/${month}/${year}`;

    function fallbackCopy(text, element) {
      const textArea = document.createElement("textarea");
      textArea.value = text; textArea.style.position = "fixed"; document.body.appendChild(textArea);
      textArea.focus(); textArea.select();
      try { document.execCommand('copy'); showSuccessMessage(element); } catch (err) {}
      document.body.removeChild(textArea);
    }

    // Αναβαθμίζουμε τη συνάρτηση playOnDemand για να αποθηκεύει ποιο index παίζει
    const originalPlayOnDemand = playOnDemand;
    playOnDemand = function(index) {
        currentOnDemandIndex = index; // Αποθηκεύουμε τη θέση
        originalPlayOnDemand(index);   // Εκτελούμε την κανονική αναπαραγωγή
    };

    function playNextTrack() {
        // Υπολογίζουμε την επόμενη θέση στη λίστα
        const nextIndex = currentOnDemandIndex + 1;
        
        // Ελέγχουμε αν υπάρχει επόμενο κομμάτι στον πίνακα onDemandTracks
        if (typeof onDemandTracks !== 'undefined' && nextIndex < onDemandTracks.length) {
            currentOnDemandIndex = nextIndex;
            playOnDemand(nextIndex); // Παίζει αυτόματα το επόμενο!
        } else {
            // Αν τελείωσε και το τελευταίο κομμάτι, επιστρέφει αυτόματα στο Live Stream
            currentOnDemandIndex = -1;
            returnToLiveStream();
        }
    }
</script>
